name: iOS Release Build & App Store Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Archive & IPA
        run: |
          flutter build ipa --no-codesign --release

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EventMatch-iOS-Build
          path: build/ios/archive/Runner.xcarchive
