name: iOS Release Build & TestFlight Deploy

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Özel Build Numarası (Boş bırakırsanız otomatik artar)'
        required: false
        default: ''

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    env:
      APP_STORE_CONNECT_ISSUER_ID: 23dee70d-c9f4-4d26-888e-d96dde8a1ba1
      APP_STORE_CONNECT_KEY_IDENTIFIER: P23W77V3QR
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_26" ]; then
            echo "Selecting $XCODE_26"
            sudo xcode-select -s "$XCODE_26/Contents/Developer"
          else
            echo "Warning: No Xcode 26 found, using default"
          fi
          xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CLI Tools
        run: |
          python3 -m pip install --upgrade pip
          pip3 install codemagic-cli-tools

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & System
        run: |
          flutter --version
          flutter doctor

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Initialize Keychain & Fetch Signing Files
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILES_DIR2="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR" "$PROFILES_DIR2"
          cp ios/EventMatch_AppStore.mobileprovision "$PROFILES_DIR/"
          cp ios/EventMatch_AppStore.mobileprovision "$PROFILES_DIR2/"

          openssl genrsa -out cert_key.pem 2048

          python3 -c "
          import subprocess, json
          try:
              p = subprocess.run(['app-store-connect', 'certificates', 'list', '--json'], capture_output=True, text=True)
              certs = json.loads(p.stdout)
              if len(certs) >= 2:
                  for c in certs:
                      if c.get('id') != '5KAB9772Q9':
                          print(f'Cleaning stale CI certificate {c.get(\"id\")}')
                          subprocess.run(['app-store-connect', 'certificates', 'delete', c.get('id')])
          except Exception as e:
              print(f'Cert cleanup note: {e}')
          "

          keychain initialize
          app-store-connect fetch-signing-files "com.eventmatch.social" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key "@file:cert_key.pem" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates --allow-all-applications
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" || true
          keychain list-certificates

          xcode-project use-profiles --project ios/Runner.xcodeproj --warn-only --export-options-plist ios/ExportOptions.plist

          echo "Generated ios/ExportOptions.plist:"
          cat ios/ExportOptions.plist

      - name: Build iOS IPA Package
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM=104
          fi
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" -lt 104 ]; then
            BUILD_NUM=104
          fi
          echo "Building iOS IPA with build number: $BUILD_NUM"
          flutter build ipa --release --build-number=$BUILD_NUM --export-options-plist=ios/ExportOptions.plist

          if [ ! -f build/ios/ipa/*.ipa ] && [ -d build/ios/archive/Runner.xcarchive ]; then
            echo "Direct exportArchive fallback using xcodebuild..."
            mkdir -p build/ios/ipa
            xcodebuild -exportArchive \
              -archivePath build/ios/archive/Runner.xcarchive \
              -exportPath build/ios/ipa \
              -exportOptionsPlist ios/ExportOptions.plist
          fi

          echo "Generated files in build/ios/ipa:"
          ls -la build/ios/ipa || true

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: EventMatch-TestFlight-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Publish to TestFlight
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found to upload!"
            exit 1
          fi
          echo "Uploading $IPA_PATH to Apple TestFlight..."
          app-store-connect publish \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --path "$IPA_PATH"
