name: iOS Release Build & TestFlight Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 60

    env:
      APP_STORE_CONNECT_ISSUER_ID: 23dee70d-c9f4-4d26-888e-d96dde8a1ba1
      APP_STORE_CONNECT_KEY_IDENTIFIER: P23W77V3QR
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CLI Tools
        run: |
          python3 -m pip install --upgrade pip
          pip3 install codemagic-cli-tools

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & System
        run: |
          flutter --version
          flutter doctor

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Initialize Keychain & Fetch Signing Files
        run: |
          openssl genrsa -out cert_key.pem 2048
          keychain initialize
          app-store-connect fetch-signing-files "com.eventmatch.social" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key cert_key.pem \
            --type IOS_APP_STORE \
            --create
          xcode-project use-profiles --project ios/Runner.xcodeproj --warn-only

      - name: Build iOS IPA Package
        run: |
          BUILD_NUM=${{ github.run_number }}
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" -lt 8 ]; then
            BUILD_NUM=8
          fi
          echo "Building iOS IPA with build number: $BUILD_NUM"
          flutter build ipa --release --build-number=$BUILD_NUM

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: EventMatch-TestFlight-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Publish to TestFlight
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to Apple TestFlight..."
          app-store-connect publish \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --path "$IPA_PATH"
