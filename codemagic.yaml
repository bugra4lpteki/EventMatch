workflows:
  ios-release:
    name: EventMatch iOS App Store & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eventmatch.social
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build iOS IPA
        script: flutter build ipa --release
      - name: Upload to App Store Connect & TestFlight
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to App Store Connect..."
            app-store-connect publish "$IPA_PATH"
          else
            echo "Searching for generated IPA package..."
            find build/ios -name "*.ipa"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
