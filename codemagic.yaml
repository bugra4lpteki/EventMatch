workflows:
  ios-release:
    name: EventMatch iOS App Store & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain for codesigning
        script: keychain initialize
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build iOS Archive
        script: flutter build ipa --release --no-codesign
      - name: Package and Sign IPA with Export Options
        script: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath $(find build/ios/archive -name "*.xcarchive") \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
